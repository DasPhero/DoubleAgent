name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  frontend:
    name: Frontend (Lint, Typecheck, Test, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  backend-and-wails:
    name: Backend & Wails Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Run Go Vet & Tests
        run: |
          go vet ./...
          go test -count=1 ./...
      - name: Build Standalone Binary (Linux)
        if: runner.os == 'Linux'
        run: wails build -tags webkit2_41 -platform linux/amd64 -o DoubleAgent-linux-amd64
      - name: Build Standalone Binary (Windows)
        if: runner.os == 'Windows'
        run: wails build -platform windows/amd64 -o DoubleAgent.exe
      - name: Upload Standalone Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DoubleAgent-${{ runner.os }}
          path: build/bin/*

